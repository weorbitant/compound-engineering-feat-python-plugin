<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="py-micro-superpowers — Superpowers for Python microservices">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1225"/>
      <stop offset="0.55" stop-color="#1a1f3d"/>
      <stop offset="1" stop-color="#252a5e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b8bbe"/>
      <stop offset="0.5" stop-color="#8b7ff7"/>
      <stop offset="1" stop-color="#ffd54d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80h1200M0 160h1200M0 240h1200"/>
    <path d="M150 0v320M300 0v320M450 0v320M600 0v320M750 0v320M900 0v320M1050 0v320"/>
  </g>

  <!-- microservice mesh (right side) -->
  <g transform="translate(830,40)">
    <g stroke="#8b7ff7" stroke-opacity="0.55" stroke-width="1.5">
      <path d="M60 60 L180 30"/>
      <path d="M60 60 L200 120"/>
      <path d="M60 60 L100 200"/>
      <path d="M180 30 L200 120"/>
      <path d="M200 120 L100 200"/>
      <path d="M200 120 L300 80"/>
      <path d="M300 80 L180 30"/>
      <path d="M100 200 L260 210"/>
      <path d="M260 210 L200 120"/>
    </g>
    <!-- hexagon nodes -->
    <g filter="url(#glow)">
      <path d="M60 44 74 52v16L60 76 46 68V52Z" fill="#4b8bbe"/>
      <path d="M180 14 194 22v16l-14 8-14-8V22Z" fill="#8b7ff7"/>
      <path d="M200 104 214 112v16l-14 8-14-8v-16Z" fill="#ffd54d"/>
      <path d="M100 184 114 192v16l-14 8-14-8v-16Z" fill="#8b7ff7"/>
      <path d="M300 64 314 72v16l-14 8-14-8V72Z" fill="#4b8bbe"/>
      <path d="M260 194 274 202v16l-14 8-14-8v-16Z" fill="#4b8bbe"/>
    </g>
  </g>

  <!-- lightning bolt -->
  <g transform="translate(64,70)" filter="url(#glow)">
    <path d="M52 0 8 96h34L26 180 96 68H56L84 0Z" fill="url(#bolt)"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="200" y="150" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">py-micro-superpowers</text>
    <text x="202" y="196" font-size="24" fill="#aab3e8">Superpowers for Python microservices</text>
    <text x="202" y="248" font-size="16" fill="#7681c2">Django · FastAPI · pytest · PostgreSQL · Celery · built on superpowers</text>
  </g>

  <rect x="200" y="264" width="620" height="4" rx="2" fill="url(#accent)"/>
</svg>
