[project]
name = "lib-common"
version = "0.1.0"
description = "Shared DTOs for the demo services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[tool.poetry]
packages = [{ include = "lib_common" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.8"
mypy = ">=1.13"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lib_common", "orders", "payments"]
